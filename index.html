<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticker Gallery</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #0f0f0f;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

header {
  padding: 20px 24px;
  border-bottom: 1px solid #222;
}

header h1 {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
}

header p {
  font-size: 12px;
  color: #555;
  margin-top: 2px;
}

main {
  padding: 24px;
  max-width: 1100px;
  margin: 0 auto;
}

.loading-text {
  color: #555;
  padding: 80px 24px;
  text-align: center;
  font-family: monospace;
  font-size: 12px;
}

#meta {
  margin-bottom: 20px;
}

#meta h2 {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 4px;
}

#meta p {
  font-size: 12px;
  color: #555;
}

.actions {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

button,
a.btn {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  color: #ccc;
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  outline: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}

.card {
  background: #161616;
  border: 1px solid #222;
  border-radius: 8px;
  overflow: hidden;
}

.card-img {
  width: 100%;
  aspect-ratio: 1;
  background: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-img img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
}

.card-img .loader {
  color: #333;
  font-size: 11px;
  font-family: monospace;
}

.card-body {
  padding: 8px 10px 10px;
}

.card-id {
  font-family: monospace;
  font-size: 10px;
  color: #555;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 6px;
}

.copy-btn {
  width: 100%;
  padding: 6px;
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 5px;
  color: #aaa;
  font-size: 12px;
  cursor: pointer;
  outline: none;
}

.copy-btn.copied {
  color: #4ade80;
  border-color: #1a3a25;
  background: #0d1f14;
}

#state-empty,
#state-error {
  text-align: center;
  padding: 80px 24px;
  color: #444;
}

#state-empty h2,
#state-error h2 {
  font-size: 16px;
  color: #555;
  margin-bottom: 8px;
}

code {
  font-family: monospace;
  background: #1a1a1a;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
  color: #777;
}
  </style>
</head>
<body>
  <header>
    <h1>Sticker Gallery</h1>
    <p>View and collect sticker IDs</p>
  </header>

  <main>
    <div id="state-loading">
      <p class="loading-text">loading gallery...</p>
    </div>

    <div id="state-empty" style="display:none">
      <h2>No paste ID</h2>
      <p>Add <code>?id=PASTE_ID</code> to the URL.</p>
    </div>

    <div id="state-error" style="display:none">
      <h2>Failed to load</h2>
      <p id="error-msg">Could not fetch paste. The ID may be invalid or expired.</p>
    </div>

    <div id="state-gallery" style="display:none">
      <div id="meta">
        <h2 id="meta-title">Sticker Gallery</h2>
        <p id="meta-sub"></p>
      </div>
      
      <div class="actions">
        <button id="copy-all-btn">Copy All IDs</button>
        <a class="btn" id="raw-link" href="#" target="_blank">View Raw</a>
      </div>
      
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <script>
const params = new URLSearchParams(location.search);
const pasteId = params.get('id');

const STATES = ['state-loading', 'state-empty', 'state-error', 'state-gallery'];

function show(id) {
  STATES.forEach(s => {
    const el = document.getElementById(s);
    if (el) el.style.display = s === id ? '' : 'none';
  });
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { 
      btn.textContent = orig; 
      btn.classList.remove('copied'); 
    }, 1500);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { 
        btn.textContent = orig; 
        btn.classList.remove('copied'); 
      }, 1500);
    }
  });
}

function parseIds(text) {
  return text.split('\n')
    .map(l => l.trim())
    .filter(l => /^\d{8,}$/.test(l));
}

function parseMeta(text) {
  const fromMatch = text.match(/^Stickers from:\s*(.+)$/m);
  const dateMatch = text.match(/^Date:\s*(.+)$/m);
  return {
    from: fromMatch ? fromMatch[1].trim() : 'Unknown',
    date: dateMatch ? dateMatch[1].trim() : ''
  };
}

async function tryFetch(url) {
  const proxies = [
    u => u,
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  ];
  
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy(url));
      if (res.ok) {
        const text = await res.text();
        if (text && text.length > 0) return text;
      }
    } catch (_) {}
  }
  return null;
}

async function fetchThumbnails(ids) {
  const map = {};
  const batchSize = 50;
  
  for (let i = 0; i < ids.length; i += batchSize) {
    const batch = ids.slice(i, i + batchSize);
    try {
      const url = `https://thumbnails.roblox.com/v1/assets?assetIds=${batch.join(',')}&size=420x420&format=Png&isCircular=false`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        for (const item of (data.data || [])) {
          if (item.imageUrl) map[String(item.targetId)] = item.imageUrl;
        }
      }
    } catch (_) {}
  }
  return map;
}

function renderCard(id) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-img">
      <span class="loader">loading...</span>
      <img alt="">
    </div>
    <div class="card-body">
      <div class="card-id">${id}</div>
      <button class="copy-btn">Copy ID</button>
    </div>
  `;
  
  card.querySelector('.copy-btn').onclick = () => 
    copyText(id, card.querySelector('.copy-btn'));
  
  return card;
}

function applyThumbnail(card, imgUrl) {
  const img = card.querySelector('img');
  const loader = card.querySelector('.loader');
  
  img.onload = () => { 
    loader.style.display = 'none'; 
    img.style.display = 'block'; 
  };
  
  img.onerror = () => { 
    loader.textContent = 'no preview'; 
  };
  
  img.src = imgUrl;
}

async function init() {
  show('state-loading');

  if (!pasteId) { 
    show('state-empty'); 
    return; 
  }

  const rawUrl = `https://pastefy.app/${pasteId}/raw`;
  const text = await tryFetch(rawUrl);

  if (!text) {
    document.getElementById('error-msg').textContent = 
      'Could not fetch paste. The ID may be invalid or expired.';
    show('state-error');
    return;
  }

  const ids = parseIds(text);

  if (!ids.length) {
    document.getElementById('error-msg').textContent = 
      'No sticker IDs found in this paste.';
    show('state-error');
    return;
  }

  const meta = parseMeta(text);
  document.getElementById('meta-title').textContent = 
    meta.from !== 'Unknown' ? `${meta.from}'s Stickers` : 'Sticker Gallery';
  
  document.getElementById('meta-sub').textContent =
    `${ids.length} sticker${ids.length !== 1 ? 's' : ''}${meta.date ? ' · ' + meta.date : ''}`;
  
  document.getElementById('raw-link').href = rawUrl;
  
  document.getElementById('copy-all-btn').onclick = () =>
    copyText(ids.join('\n'), document.getElementById('copy-all-btn'));

  const grid = document.getElementById('grid');
  const cardMap = {};
  
  ids.forEach(id => {
    const card = renderCard(id);
    cardMap[id] = card;
    grid.appendChild(card);
  });

  show('state-gallery');

  const thumbs = await fetchThumbnails(ids);
  for (const id of ids) {
    if (thumbs[id]) {
      applyThumbnail(cardMap[id], thumbs[id]);
    } else {
      cardMap[id].querySelector('.loader').textContent = 'no preview';
    }
  }
}

init();
  </script>
</body>
</html>
